<!DOCTYPE html>
<html lang="uk" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="favicon.svg" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mobile Lang Player</title>

  <!-- Подключение Bootstrap 5 и Иконок -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- Библиотека для парсинга Markdown ответов от DeepSeek -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
  body { 
    height: 100dvh; 
    overflow: hidden; 
    display: flex; 
    flex-direction: column; 
    background-color: #1a1a1c; 
    overscroll-behavior-y: none;
  }

  #playerScreen, #settingsScreen, #aiOffcanvas {
    background-color: #0a0a0a !important; 
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.5); 
  }
  
  #playerScreen { display: flex; flex-direction: column; height: 100%; }
  
  /* Контейнер субтитров */
  .subtitles-container { 
    flex-grow: 1; 
    overflow-y: auto; 
    padding: 6px 6px; 
    font-size: 1.05rem; 
    line-height: 1.35; 
  }

  @media (min-width: 768px) {
    .subtitles-container { 
      padding: 16px 20px; 
      font-size: 1.25rem; 
      line-height: 1.5; 
    }
  }

  /* Чекбокс без лишних внешних сдвигов */
  .phrase-checkbox {
    width: 1.25rem;
    height: 1.25rem;
    margin: 0 !important;
    cursor: pointer;
    border-color: rgba(255, 255, 255, 0.25) !important;
  }

  /* Кнопки действий у фраз */
  .sub-btn {
    width: 29px;
    height: 29px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50% !important;
    border: none !important;
    background: rgba(255, 255, 255, 0.06);
    transition: transform 0.1s ease, background-color 0.15s ease;
    flex-shrink: 0;
    touch-action: manipulation;
  }
  .sub-btn:active {
    transform: scale(0.88);
    background: rgba(255, 255, 255, 0.2);
  }
  .btn-sub-play { color: #ffc107; }
  .btn-sub-trans { color: #adb5bd; }
  .btn-sub-ai { color: #0dcaf0; }

  /* Выделение слов и субтитров */
  .toTranslate { cursor: pointer; } 
  .toTranslate:active { background-color: rgba(255,255,255,0.2); border-radius: 4px; }
  .subtitleCurrent { color: #1D9BF5; }

  /* Нижняя панель плеера */
  .audio-controls {
    max-width: 520px;
    margin: 0 auto;
    width: 100%;
  }

  /* Универсальные стили управляющих кнопок */
  .btn-control {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.1s ease, opacity 0.15s ease;
    user-select: none;
  }

  .btn-control:active {
    transform: scale(0.90);
    opacity: 0.75;
  }

  .btn-control.hero { font-size: 3rem; width: 56px; height: 56px; }
  .btn-control.primary { font-size: 2.1rem; width: 44px; height: 44px; }
  .btn-control.secondary { font-size: 1.45rem; width: 38px; height: 38px; }

  #audioContainerBox {
    padding-bottom: calc(0.8rem + env(safe-area-inset-bottom, 12px)) !important;
  }

  .markdown-body p { margin-top: 0; margin-bottom: 10px; line-height: 1.4; }
  .markdown-body strong { color: #1D9BF5; }
  .markdown-body ul { padding-left: 20px; margin-top: 5px; margin-bottom: 10px; }

  .subtitles-container::-webkit-scrollbar { width: 8px; }
  .subtitles-container::-webkit-scrollbar-track { background: transparent; }
  .subtitles-container::-webkit-scrollbar-thumb { background-color: #444; border-radius: 10px; }
  .subtitles-container::-webkit-scrollbar-thumb:hover { background-color: #666; }
</style>
</head>
<body>

  <!-- ==================== ЭКРАН 1: ПЛЕЕР ==================== -->
  <div id="playerScreen" class="w-100 h-100 d-flex flex-column mx-auto border-start border-end border-secondary border-opacity-25" style="max-width: 900px;">
    
    <!-- Видеоплеер -->
    <div id="videoContainerBox" class="ratio ratio-16x9 bg-black flex-shrink-0" style="display: none;">
      <video id="videoPlayer" playsinline></video>
    </div>

    <!-- Основные субтитры -->
    <div class="subtitles-container flex-grow-1 overflow-auto" id="allTopSubs">
      <div class="d-flex flex-column align-items-center justify-content-center h-100 text-center text-muted">
        <i class="bi bi-file-earmark-play display-1 mb-3"></i>
        <p class="small" data-i18n="noMediaText">Натисніть на шестірню внизу,<br>щоб завантажити медіафайл та субтитри</p>
      </div>
    </div>
    
    <!-- НИЖНИЙ БЛОК -->
    <div class="mt-auto flex-shrink-0 bg-dark border-top z-3">
      
      <!-- Нижние субтитры (перевод) с кнопками по краям -->
      <div class="d-flex align-items-center justify-content-between px-2 border-bottom" style="min-height: 52px;">
        
        <!-- Кнопка очистки отметок (слева) -->
        <button class="btn-control secondary text-secondary flex-shrink-0" id="btnClearCheckboxes" title="Очистити виділення">
          <i class="bi bi-x-square"></i>
        </button>

        <!-- Субтитры перевода по центру между кнопками -->
        <div class="p-2 text-center text-light flex-grow-1 d-flex align-items-center justify-content-center" id="videoSubtitlesBottom" style="font-size: 1.1rem; min-width: 0; word-break: break-word;">
          ...
        </div>

        <!-- Кнопка режима повтора/зацикливания (зеркально справа) -->
        <button class="btn-control secondary text-secondary flex-shrink-0" id="btnLoopMode" data-i18n-title="loopNone" title="Без зациклювання">
          <i class="bi bi-arrow-right" id="loopIcon"></i>
        </button>

      </div>

      <!-- Единая панель управления аудио и плеером -->
      <div id="audioContainerBox" class="p-2 px-3">
        
        <!-- 1. Полоса прогресса -->
        <div class="d-flex align-items-center mb-2">
          <span id="currentTimeDisplay" class="text-muted small me-2" style="min-width: 35px;">0:00</span>
          <input type="range" class="form-range flex-grow-1" id="audioProgressBar" min="0" max="100" value="0">
          <span id="durationDisplay" class="text-muted small ms-2 text-end" style="min-width: 35px;">0:00</span>
        </div>

        <!-- 2. Сетка кнопок (Play гарантированно по центру) -->
        <div class="audio-controls d-grid align-items-center" style="grid-template-columns: 1fr auto 1fr;">
          
          <!-- Левый край: Настройки -->
          <div class="d-flex justify-content-start">
            <button class="btn-control secondary text-secondary" id="btnGoSettings" title="Налаштування">
              <i class="bi bi-gear-fill"></i>
            </button>
          </div>

          <!-- Центр: Воспроизведение -->
          <div class="d-flex justify-content-center align-items-center gap-3">
            <button class="btn-control primary text-light" id="btnPrevSub" title="Назад (A)">
              <i class="bi bi-skip-backward-fill"></i>
            </button>
            <button class="btn-control primary text-warning" id="btnRepeatSub" title="Повторити (S)">
              <i class="bi bi-arrow-counterclockwise"></i>
            </button>
            <button class="btn-control hero text-primary" id="btnPlayPause" title="Плей/Пауза (Пробіл)">
              <i class="bi bi-play-circle-fill" id="playPauseIcon"></i>
            </button>
            <button class="btn-control primary text-light" id="btnNextSub" title="Вперед (D)">
              <i class="bi bi-skip-forward-fill"></i>
            </button>
          </div>

          <!-- Правый край: пустой блок для сохранения точной центровки сетки 1fr auto 1fr -->
          <div></div>

        </div>

      </div>
    </div>
  </div>

  <!-- ==================== ЭКРАН 2: НАСТРОЙКИ ==================== -->
  <div id="settingsScreen" class="w-100 h-100 d-none d-flex flex-column bg-dark mx-auto border-start border-end border-secondary border-opacity-25" style="max-width: 900px;">
    
    <!-- Шапка настроек -->
    <nav class="navbar navbar-dark bg-dark sticky-top border-bottom px-3 flex-shrink-0">
      <div class="d-flex align-items-center w-100">
        <button class="btn btn-outline-light me-3" id="btnGoPlayer" data-i18n="backBtn">
          <i class="bi bi-arrow-left"></i> Назад
        </button>
        <h5 class="mb-0 text-light" data-i18n="settingsTitle">Налаштування</h5>
      </div>
    </nav>

    <!-- Тело настроек -->
    <div class="container py-4 text-light flex-grow-1 overflow-auto pb-5">

      <!-- Карточка: Язык интерфейса -->
      <div class="card bg-dark border-secondary mb-3">
        <div class="card-body py-2">
          <div class="d-flex justify-content-between align-items-center">
            <label class="form-label small mb-0" data-i18n="uiLanguage">Мова інтерфейсу</label>
            <select class="form-select form-select-sm bg-dark text-light border-secondary w-50" id="interfaceLang">
              <option value="uk">Українська</option>
              <option value="ru">Русский</option>
              <option value="en">English</option>
              <option value="de">Deutsch</option>
              <option value="es">Español</option>
              <option value="fr">Français</option>
            </select>
          </div>
        </div>
      </div>
      
      <!-- Карточка: Загрузка файлов -->
      <div class="card bg-dark border-secondary mb-3">
        <div class="card-body">
          <h6 class="card-title text-primary" data-i18n="uploadFilesTitle"><i class="bi bi-folder2-open"></i> Завантаження файлів</h6>
          
          <div class="mb-3">
            <label class="form-label small" data-i18n="mediaFileLabel">Медіафайл (MP3 / MP4)</label>
            <input class="form-control form-control-sm bg-dark text-light border-secondary" type="file" id="videoFile" accept="video/*,audio/*">
          </div>
          
          <div class="mb-3">
            <label class="form-label small" data-i18n="subtitlesTopLabel">Субтитри (Основні - SRT / LRC)</label>
            <input class="form-control form-control-sm bg-dark text-light border-secondary" type="file" id="subtitlesTop" accept=".srt,.lrc">
          </div>

          <div class="mb-3">
            <label class="form-label small" data-i18n="subtitlesBottomLabel">Субтитри (Переклад - SRT / LRC)</label>
            <input class="form-control form-control-sm bg-dark text-light border-secondary" type="file" id="subtitlesBottom" accept=".srt,.lrc">
          </div>
          
          <div class="form-check form-switch mt-2">
            <input class="form-check-input" type="checkbox" id="stopAfterSubtitle" checked>
            <label class="form-check-label small" for="stopAfterSubtitle" data-i18n="autoPauseLabel">Автопауза після фрази</label>
          </div>
          <div class="form-check form-switch mt-2">
            <input class="form-check-input" type="checkbox" id="speakOnTap">
            <label class="form-check-label small text-info" for="speakOnTap" data-i18n="speakOnTapLabel">Озвучувати слово по тапу</label>
          </div>
        </div>
      </div>

      <!-- Аккордеон: Глубокие настройки -->
      <div class="accordion accordion-flush bg-dark" id="settingsAccordion">
        
        <!-- Языки -->
        <div class="accordion-item bg-dark border-secondary">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed bg-dark text-light" type="button" data-bs-toggle="collapse" data-bs-target="#collapseLang" data-i18n="languagesTitle">
              <i class="bi bi-globe me-2"></i> Мови перекладу та озвучення
            </button>
          </h2>
          <div id="collapseLang" class="accordion-collapse collapse" data-bs-parent="#settingsAccordion">
            <div class="accordion-body">
              <div class="mb-3">
                <label class="form-label small" data-i18n="learningLangLabel">Мова вивчення (Озвучення)</label>
                <select class="form-select form-select-sm bg-dark text-light border-secondary" id="sl">
                  <option value="en" data-i18n="langEn">Англійська</option>
                  <option value="de" data-i18n="langDe">Німецька</option>
                  <option value="fr" data-i18n="langFr">Французька</option>
                  <option value="es" data-i18n="langEs">Іспанська</option>
                  <option value="it" data-i18n="langIt">Італійська</option>
                  <option value="pl" data-i18n="langPl">Польська</option>
                  <option value="uk" data-i18n="langUk">Українська</option>
                  <option value="ru" data-i18n="langRu">Російська</option>
                </select>
              </div>
              <div>
                <label class="form-label small" data-i18n="nativeLangLabel">Рідна мова (Переклад)</label>
                <select class="form-select form-select-sm bg-dark text-light border-secondary" id="tl">
                  <option value="uk" data-i18n="langUk">Українська</option>
                  <option value="ru" data-i18n="langRu">Російська</option>
                  <option value="en" data-i18n="langEn">Англійська</option>
                  <option value="de" data-i18n="langDe">Німецька</option>
                  <option value="fr" data-i18n="langFr">Французька</option>
                  <option value="es" data-i18n="langEs">Іспанська</option>
                  <option value="it" data-i18n="langIt">Італійська</option>
                  <option value="pl" data-i18n="langPl">Польська</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- DeepSeek API -->
        <div class="accordion-item bg-dark border-secondary">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed bg-dark text-light" type="button" data-bs-toggle="collapse" data-bs-target="#collapseAI" data-i18n="aiTitle">
              <i class="bi bi-robot me-2"></i> Нейромережа (DeepSeek)
            </button>
          </h2>
          <div id="collapseAI" class="accordion-collapse collapse" data-bs-parent="#settingsAccordion">
            <div class="accordion-body">
              <div class="mb-3">
                <label class="form-label small" data-i18n="apiKeyLabel">API-ключ DeepSeek:</label>
                <input type="text" class="form-control form-control-sm bg-dark text-light border-secondary" id="deepseekApiKey" placeholder="sk-...">
              </div>
              <div>
                <label class="form-label small" data-i18n="systemPromptLabel">Системна інструкція:</label>
                <textarea class="form-control form-control-sm bg-dark text-light border-secondary" id="deepseekInstruction" rows="6"></textarea>
              </div>
            </div>
          </div>
        </div>

        <!-- Управление данными / Сброс -->
        <div class="accordion-item bg-dark border-secondary">
          <h2 class="accordion-header">
            <button class="accordion-button collapsed bg-dark text-secondary" type="button" data-bs-toggle="collapse" data-bs-target="#collapseSystem" data-i18n="systemDataTitle">
              <i class="bi bi-trash3 me-2"></i> Скидання даних
            </button>
          </h2>
          <div id="collapseSystem" class="accordion-collapse collapse" data-bs-parent="#settingsAccordion">
            <div class="accordion-body text-center">
              <button class="btn btn-outline-danger w-100" id="btnResetSettings" data-i18n="resetSettingsBtn">
                <i class="bi bi-exclamation-triangle"></i> Скинути всі налаштування
              </button>
            </div>
          </div>
        </div>
      </div>

      

    </div>
  </div>

  <!-- ==================== ШТОРКА DEEPSEEK (Offcanvas) ==================== -->
  <div class="offcanvas offcanvas-bottom bg-dark text-light mx-auto border-start border-end border-secondary border-opacity-25" tabindex="-1" id="aiOffcanvas" style="height: 75dvh; border-top: 1px solid #444; max-width: 900px;">
    <div class="offcanvas-header border-bottom border-secondary py-2">
      <h6 class="offcanvas-title mb-0" data-i18n="analysisTitle"><i class="bi bi-stars text-primary"></i> Лінгвистичний розбір</h6>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body overflow-auto" id="aiOffcanvasBody">
    </div>
    <!-- Поле для дополнительных вопросов -->
    <div class="offcanvas-footer p-2 border-top border-secondary d-flex gap-2" style="background-color: #121212;">
      <input type="text" id="aiFollowUpInput" class="form-control form-control-sm bg-dark text-light border-secondary" style="display: none;">
      <button id="btnSendFollowUp" class="btn btn-primary btn-sm" style="display: none;"><i class="bi bi-send-fill"></i></button>
    </div>
  </div>

  <!-- Подключение скриптов -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="mobile_player.js?ver=49"></script>

</body>
</html>
